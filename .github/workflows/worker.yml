name: Deploy realtime API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check allowed origins
        run: node -e "if (!process.env.ALLOWED_ORIGINS?.startsWith('https://')) throw new Error('Set ALLOWED_ORIGINS to your GitHub Pages origin, for example https://username.github.io')"
      - run: npm run deploy:api -- --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS"
